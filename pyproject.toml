[project]
name = "anydocs-agent"
version = "0.1.0"
description = "A documentation agent that answers from a durable knowledge store, and learns when it cannot."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # transport
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    # Model providers. No module imports these directly — LangChain does the calling — but the
    # openinference instrumentors patch these SDKs, so they are a runtime requirement, not a
    # leftover. An import grep will say otherwise.
    "anthropic>=0.40",
    "openai>=1.40",
    # code linting for the Auditor
    "pyflakes>=3.2",
    # telemetry. No vendor wrapper: Phoenix and AX share the stock OTLP/HTTP exporter below.
    # Loaded by name through `importlib.import_module` in `telemetry._instrument_llm_sdks`, so
    # these four are invisible to an import grep too.
    "openinference-instrumentation-anthropic>=0.1.6",
    "openinference-instrumentation-openai>=0.1.14",
    "openinference-semantic-conventions>=0.1.9",
    "opentelemetry-sdk>=1.27",
    # HTTP only: the gRPC exporter drags in grpcio for a transport that does not survive a frozen
    # or forked process anyway. Nothing here may depend on the `opentelemetry-exporter-otlp`
    # meta-package, which is how grpcio came back last time. See `_register_otlp`.
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "mcp>=1.2",
    "sqlite-vec>=0.1.9",
    "langgraph>=1.2.19",
    "langchain>=1.4.8",
    "langchain-openai>=1.7.3",
    "langchain-anthropic>=1.7.9",
    "openinference-instrumentation-langchain>=0.1.81",
    "openinference-instrumentation-mcp>=2.1.0",
]

[project.optional-dependencies]
# Page cleaning for crawl, fetch and diff. Optional because the serverless deploy never crawls,
# and with its language data it is about 60 MB. The container installs it.
crawl = ["trafilatura>=1.12"]
phoenix = ["arize-phoenix>=7.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    # The parity oracle for `retrieval._bm25`, not a runtime dependency: it brings numpy.
    "rank-bm25>=0.2.2",
    "ruff>=0.7",
]

[project.scripts]
anydocs = "cli.main:app"

[tool.vercel]
entrypoint = "anydocs.server:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anydocs", "analytics", "cli"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
