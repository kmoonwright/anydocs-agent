# Role -> provider/model. The ROLE name is what appears on spans, so experiments
# compare roles, not model strings. Swapping a provider for a role is a config change.
#
# The two providers expose different knobs for the same idea: Anthropic's Messages API takes
# `effort` (low | medium | high | xhigh | max) and no longer accepts a temperature, while OpenAI
# takes a temperature. Set both; each adapter sends the one its SDK has and ignores the other,
# so moving a role between providers does not mean rewriting its config.
#
# `effort` is a Claude 5 feature. Claude 4.x models reject it, so `resolve_role` strips it from any
# model that is not Claude 5 and records `model.degraded` on the span rather than failing every
# call. Claude 5 models reject a non-default temperature instead, so every role here sets effort.
#
# Roles:
#   router      cheap, fast: query classification, source judging, rerank
#   summarizer  cheap, high-volume: digest filling, rolling session summaries
#   reader      mid-tier: query rewriting, drafting answers from retrieved material
#   judge       frontier: the Auditor's per-claim verification
#   synthesizer mid-tier: the final answer

default_provider: anthropic

roles:
  router:
    provider: anthropic
    # Haiku 5.5 is a tenth of Haiku 4.5's price, and planning and reranking are the calls that
    # need judgment least.
    model: claude-haiku-5-5
    # One score per candidate, up to 30 of them in a single rerank call.
    max_tokens: 2048
    temperature: 0.0
    effort: low

  summarizer:
    provider: anthropic
    model: claude-haiku-5-5
    # A digest of a full-size page is big, and 4096 truncated the largest doc in the test corpus.
    # A truncated tool call is not a partial digest: Anthropic streams tool input as partial JSON,
    # so a response cut off mid-value arrives as a well-formed call whose unclosed field is a raw
    # string, and the page fails validation on a Pydantic type error that says nothing about the
    # real cause. The limit has to fit the whole output.
    max_tokens: 16384
    temperature: 0.0
    # A digest is what every later answer reads, so it gets Haiku 5.5's default rather than `low`.
    effort: medium

  reader:
    provider: anthropic
    model: claude-sonnet-5
    # A drafted answer plus its citation list. See the note on `summarizer`: a structured result
    # cut off at the limit is not a short answer, it is an unparseable one.
    max_tokens: 16384
    temperature: 0.2
    effort: medium

  judge:
    provider: anthropic
    model: claude-sonnet-5
    # One verdict per claim, with the quote it was checked against. Measured: an audit of a
    # five-citation answer passed 8.5k characters and was truncated mid-string at 4096.
    max_tokens: 16384
    temperature: 0.0
    # Measured at `high`, the Auditor was ~70% of a turn's wall clock. Its work is mostly
    # matching claims against chunks it was handed, so `medium` is the better trade.
    effort: medium

  synthesizer:
    provider: anthropic
    model: claude-sonnet-5
    max_tokens: 16384
    temperature: 0.3
    effort: medium

embeddings:
  provider: openai
  model: text-embedding-3-small
  dim: 1536

# Per-million-token prices, used for the crawl cost estimate shown at approval
# and for the daily USD cap. Approximate on purpose; they gate spend, not billing. Cache reads are
# priced as ordinary input, so a cached turn is over-estimated, never under.
# Haiku 5.5 doubles past 100k input tokens in one call, which no role here comes near.
pricing:
  claude-haiku-5-5: {input: 0.10, output: 0.50}
  claude-haiku-4-5-20251001: {input: 1.00, output: 5.00}
  claude-sonnet-5: {input: 2.00, output: 10.00}
  claude-sonnet-5-5: {input: 2.00, output: 10.00}
  claude-opus-5-5: {input: 4.00, output: 20.00}
  claude-opus-5: {input: 5.00, output: 25.00}
  gpt-4.1-mini: {input: 0.40, output: 1.60}
  gpt-4.1: {input: 2.00, output: 8.00}
  text-embedding-3-small: {input: 0.02, output: 0.0}
